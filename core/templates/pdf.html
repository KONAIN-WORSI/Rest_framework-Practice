<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>

  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f9;
            padding: 40px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: #0d6efd;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        .header h2 {
            font-size: 28px;
        }

        .content {
            padding: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table tr:nth-child(even) {
            background: #f8f9fa;
        }

        table th,
        table td {
            padding: 14px 18px;
            border: 1px solid #ddd;
            text-align: left;
        }

        table th {
            width: 35%;
            background: #e9ecef;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            padding: 15px;
            background: #f1f1f1;
            color: #666;
            font-size: 14px;
        }

        @media print {
            body {
                background: #fff;
                padding: 0;
            }

            .container {
                box-shadow: none;
                border: 1px solid #ccc;
            }
        }
    </style> 
</head>
<body>

<div class="container">

    <div class="header">
        <h2>Student Information</h2>
    </div>

    <div class="content">
        <table>
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>Student Name</th>
                    <th>Age</th>
                    <th>Father Name</th>
                </tr>
            </thead>
            <tbody>
                {% for student in student_objs %}
                   <tbody>
                    {% for student in student_objs %}
                    <tr>
                        <th scope="row">{{ forloop.counter }}</th>
                        <!-- <td>{{ student.id }}</td> -->
                        <td>{{ student.name }}</td>
                        <td>{{ student.age }}</td>
                        <td>{{ student.father_name }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
                {% endfor %}
            </tbody>    
        </table>
    </div>

    <div class="footer">
        Generated by Django
    </div>

</div>

</body>
</html>
